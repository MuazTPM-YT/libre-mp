# build + test core, cli and desktop app on linux, windows, macos
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libclang-dev \
            libpipewire-0.3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libegl-dev libgbm-dev libwayland-dev libv4l-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev

      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Core + CLI clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core + CLI tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desktop app clippy
        working-directory: frontend/src-tauri
        run: cargo clippy -- -D warnings

  # every big linux family: install script deps + build, core tests, x11 capture sees pixels, app starts
  linux-distros:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-22.04, image: "ubuntu:22.04", prep: "apt-get update && apt-get install -y git ca-certificates", x11: "apt-get install -y xvfb xterm xfonts-base" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04", prep: "apt-get update && apt-get install -y git ca-certificates", x11: "apt-get install -y xvfb xterm xfonts-base" }
          - { name: debian-12, image: "debian:12", prep: "apt-get update && apt-get install -y git ca-certificates", x11: "apt-get install -y xvfb xterm xfonts-base" }
          - { name: mint-22, image: "linuxmintd/mint22-amd64", prep: "apt-get update && apt-get install -y git ca-certificates", x11: "apt-get install -y xvfb xterm xfonts-base" }
          - { name: kali, image: "kalilinux/kali-rolling", prep: "apt-get update && apt-get install -y git ca-certificates", x11: "apt-get install -y xvfb xterm xfonts-base" }
          - { name: fedora-42, image: "fedora:42", prep: "dnf install -y git", x11: "dnf install -y xorg-x11-server-Xvfb xterm xorg-x11-fonts-misc" }
          - { name: arch, image: "archlinux:latest", prep: "pacman -Syu --noconfirm git", x11: "pacman -S --noconfirm xorg-server-xvfb xterm xorg-fonts-misc" }
          - { name: opensuse, image: "opensuse/tumbleweed", prep: "zypper -n install git tar gzip", x11: "zypper -n install --force-resolution xorg-x11-server-Xvfb xterm xorg-x11-fonts-core" }
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare container
        run: ${{ matrix.prep }}
      - uses: actions/checkout@v4
      - name: Install script deps
        run: scripts/install-linux.sh --deps-only
      - name: Install script build + install
        run: scripts/install-linux.sh --no-deps
      - name: Core + CLI tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --workspace
      - name: X11 capture and app start
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ${{ matrix.x11 }}
          Xvfb :99 -screen 0 1366x768x24 &  # small laptop screen: window must shrink, capture must still work
          sleep 3
          export DISPLAY=:99 XDG_SESSION_TYPE=x11
          # red window over the middle (xsetroot does not paint root on xvfb, so a window it is)
          xterm -fn fixed -bg red -geometry 400x200+0+0 &
          sleep 3
          cargo run --release -p libremp-core --example portal_probe /tmp/out.png | tee probe.txt
          grep -q 'center rgb 255 0 0' probe.txt
          set +e
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 timeout 20 "$HOME/.local/bin/libremp-app"
          code=$?
          set -e
          echo "app exit code $code (124 = still running after 20 s = good)"
          test "$code" -eq 124

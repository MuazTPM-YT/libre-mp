# build + test core, cli and desktop app on linux, windows, macos
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libclang-dev \
            libpipewire-0.3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libegl-dev libgbm-dev libwayland-dev libv4l-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev

      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Core + CLI clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core + CLI tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Desktop app clippy
        working-directory: frontend/src-tauri
        run: cargo clippy -- -D warnings

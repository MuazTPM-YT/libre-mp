[package]
name = "libremp-app"
version = "0.1.0"
description = "LibreMP — cross-platform Epson projector streamer"
authors = ["LibreMP"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Tauri crate is its own workspace (separate target dir / build invocation).
[workspace]

[lib]
name = "libremp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libremp-core = { path = "../../core" }
# Native camera capture for live QR scanning (V4L2 / AVFoundation / MediaFoundation).
# Deliberately NOT the webview getUserMedia path, which segfaults WebKitGTK.
# No default features: its mozjpeg clashes with core's libjpeg-turbo at link time. MJPEG is decoded by core instead.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
# Encode camera frames as data: URLs to stream a live preview into an <img>.
base64 = "0.22"


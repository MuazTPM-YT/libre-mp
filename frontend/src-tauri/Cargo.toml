[package]
name = "frontend"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Tauri crate is its own workspace (separate target dir / build invocation).
[workspace]

[lib]
name = "frontend_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12.3"
lazy_static = "1.5.0"
tokio = { version = "1", features = ["full"] }
libremp-core = { path = "../../core" }
# Native camera capture for live QR scanning (V4L2 / AVFoundation / MediaFoundation).
# Deliberately NOT the webview getUserMedia path, which segfaults WebKitGTK.
nokhwa = { version = "0.10", features = ["input-native"] }


[workspace]
resolver = "2"
members = ["core", "cli"]
exclude = ["vendor"]
# frontend/src-tauri is its own workspace (Tauri convention); it depends on core by path.

[profile.release]
opt-level = 3

# libspa 0.9.2 + fix for pipewire < 0.3.65 (ubuntu 22.04, mint 21). see vendor/libspa/build.rs
[patch.crates-io]
libspa = { path = "vendor/libspa" }

[package]
name = "libremp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
turbojpeg = "1"
byteorder = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winsock2", "ws2def", "mstcpip", "minwindef", "winuser", "wingdi", "errhandlingapi", "winbase", "memoryapi", "libloaderapi", "windef"] }

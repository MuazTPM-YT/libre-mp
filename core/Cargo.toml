[package]
name = "libremp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
turbojpeg = "~1.4.0"
byteorder = "~1.5.0"
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = "~1.0.150"
# QR decoding for Epson iProjection "Quick Connect" codes.
quircs = "~0.10.3"
# Universal screen capture. xcap handles Wayland via xdg-desktop-portal +
# PipeWire (KDE/GNOME/wlroots) and also X11/Windows/macOS; scrap is the fast
# direct grabber for X11/macOS. Both are used with a fallback chain.
xcap = "~0.9.6"
image = "~0.25.10"
# Saved Wi-Fi passwords live in the OS keychain (Secret Service, Keychain, Credential Manager).
keyring = "~4.2.0"
scrap = "~0.5.0"

[target.'cfg(unix)'.dependencies]
libc = "~0.2.186"

# Wayland screen capture: xdg-desktop-portal ScreenCast (zbus) + PipeWire.
# Both are already pulled in by xcap, so they cost no extra build time.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "~0.9.2"
zbus = "~5.16.0"
# XFixes, to draw the mouse pointer into X11 captures (XShm does not include it).
xcb = { version = "~1.7.0", features = ["xfixes"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "~0.3.9", features = ["winsock2", "ws2def", "mstcpip", "minwindef", "winuser", "wingdi", "errhandlingapi", "winbase", "memoryapi", "libloaderapi", "windef"] }
